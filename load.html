<!DOCTYPE html>
<html lang="pt-BR">
<head>
    

<style>
    body{
   
        background-color: #111;
        color: aliceblue;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;

    }
    .box{
        margin: auto;
        position: relative;
        width: 300px;
        height: 180px;
        border-radius: 16px;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        
    }

    .box::before{
        content: '';
        position: absolute;
        inset: -50%;
        background: conic-gradient(
    from 0deg,
    transparent 0%,
    #00e5ff 12%,
    #0080ff 20%,
    #a70c79 18%,
    #640aeb 36%,
    transparent 48%,
    transparent 100%
);

        animation: spin 3s linear infinite;
    }

    .box::after{
        content: '';
        position: absolute;
        inset: 3px;
        background: #111;
        border-radius: 14px;
    }

    @keyframes spin {
        to{
            transform: rotate(360deg)
        }
    }

   .box > span {
    color: white;
    position: relative;
    z-index: 1;
}

.loading{
    
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: 5px;
    color: white;
}

.dots{
    display: flex;
    gap: 3px;
}

.dots i{
    margin-left: 10px;
    margin-top: 10px;
    width: 5px;
    height: 5px;
    background-color: white;
    border-radius: 50%;
    animation: piscar 1.2s infinite;
}

/* .loading span{
    width: 8px;
    height: 8px;
    background-color: white;
    border-radius: 50%;
    animation: piscar 1.2s infinite;
} */

.dots i:nth-child(2){
    animation-delay: 0.2s;
}

.dots i:nth-child(3){
    animation-delay: 0.4s;

}
@keyframes piscar{
    0%, 100%{
        opacity: 0.2;;
        
    }
    50%{
        opacity: 1;;
        
    }
}



</style>










    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading</title>
</head>
<body>

    <div class="box">
         <div class="loading">
        <span>Loading</span>
       
           <div class="dots">
            <i></i>
            <i></i>
            <i></i>
           </div>
        </div>

    </div>
    
</body>
</html>
